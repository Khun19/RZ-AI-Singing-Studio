name: Automatic Pull Request Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: automatic-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-proposed-scripts:
    name: Validate proposed PR recovery scripts (read-only)
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Syntax-check and simulate async merge recovery
        run: |
          bash -n .github/scripts/request-async-merge.sh
          bash -n .github/scripts/test-async-merge-recovery.sh
          bash .github/scripts/test-async-merge-recovery.sh

  enable-github-auto-merge:
    name: Request ruleset-gated asynchronous squash merge
    needs: [validate-proposed-scripts]
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Verify current PR identity and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" '
            .state == "open" and .merged == false and .draft == false
            and .base.ref == "main"
            and .head.repo.full_name == $repo
            and .head.sha == $head
            and .base.sha == $base
          ' <<<"$pr" >/dev/null
          echo "PR identity and exact event SHAs verified."

      - name: Checkout trusted base-branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Request asynchronous squash merge with UUID reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: bash .github/scripts/request-async-merge.sh
