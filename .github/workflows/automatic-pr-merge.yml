name: Automatic Pull Request Merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

# Candidate PR code is never run with write privileges by this workflow.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: automatic-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-pr-identity:
    name: Read-only PR identity and policy validation
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source for read-only inspection
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run read-only policy regression script
        run: python3 .github/scripts/test-merge-workflow-policy.py

      - name: Verify PR identity and event SHAs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" '
            .state == "open" and .merged == false and .draft == false
            and .base.ref == "main"
            and .head.repo.full_name == $repo
            and .head.sha == $head
            and .base.sha == $base
          ' <<<"$pr" >/dev/null
          echo "PR identity verified. This workflow is read-only and does not request or enable merging."
