name: Automatic Pull Request Merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automatic-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable-github-auto-merge:
    name: Request ruleset-gated asynchronous squash merge
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Verify current PR identity and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EXPECTED_HEAD_SHA" --arg base "$EXPECTED_BASE_SHA" '
            .state == "open" and .merged == false and .draft == false
            and .base.ref == "main"
            and .head.repo.full_name == $repo
            and .head.sha == $head
            and .base.sha == $base
          ' <<<"$pr" >/dev/null
          echo "PR identity and exact event SHAs verified."

      - name: Request asynchronous squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge-async" \
            -f merge_method=squash \
            -f expected_head_sha="$EXPECTED_HEAD_SHA")"
          status="$(jq -r '.status // empty' <<<"$response")"
          case "$status" in
            pending|enqueued|merged)
              echo "Asynchronous squash merge accepted: $status"
              ;;
            *)
              echo "Unexpected async merge response; failing closed." >&2
              jq . <<<"$response" >&2
              exit 1
              ;;
          esac
