name: Trusted Async Merge Contract
on:
  pull_request_target:
    branches: [main]
    paths:
      - '.github/scripts/request-async-merge.sh'
      - '.github/scripts/trusted-async-merge-contract.sh'
      - '.github/scripts/trusted-async-merge-contract.py'
      - '.github/scripts/test-trusted-async-merge-contract.py'
      - '.github/workflows/async-merge.yml'
      - '.github/workflows/trusted-async-merge-contract.yml'
permissions:
  contents: read
jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Checkout proposed head as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: proposed
          persist-credentials: false
      - name: Test trusted checker regression fixtures
        run: python3 trusted-base/.github/scripts/test-trusted-async-merge-contract.py
      - name: Audit proposed script with trusted base checker
        run: python3 trusted-base/.github/scripts/trusted-async-merge-contract.py proposed/.github/scripts/request-async-merge.sh
