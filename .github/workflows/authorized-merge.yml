name: Authorized Merge Gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      expected_head_sha:
        description: "Exact 40-character PR head SHA"
        required: true
        type: string
      expected_base_sha:
        description: "Exact 40-character main/base SHA"
        required: true
        type: string
      authorization_phrase:
        description: "Type MERGE-PR-<number>-<full-head-sha> to authorize this one merge"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: authorized-merge-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  verify-authorization-and-evidence:
    name: Verify explicit authorization and exact-head evidence
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.verify.outputs.run_id }}
    steps:
      - name: Verify actor, authorization phrase, PR identity and exact SHAs
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AUTHORIZATION_PHRASE: ${{ inputs.authorization_phrase }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Dispatch this trusted workflow from main only."; exit 1; }
          test "$GITHUB_ACTOR" = "Khun19" || { echo "::error::Only Khun19 may authorize."; exit 1; }
          test "$TRIGGERING_ACTOR" = "Khun19" || { echo "::error::Only Khun19 may run or rerun this authorization."; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$AUTHORIZATION_PHRASE" = "MERGE-PR-$PR_NUMBER-$EXPECTED_HEAD_SHA" || {
            echo "::error::Authorization phrase mismatch."; exit 1;
          }

          main_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          current_main_sha="$(jq -r '.object.sha' <<<"$main_ref")"
          test "$current_main_sha" = "$EXPECTED_BASE_SHA" || {
            echo "::error::main moved; expected base SHA does not match current main."
            exit 1
          }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EXPECTED_HEAD_SHA" \
            '.state == "open" and .merged == false and .draft == false
             and .base.ref == "main"
             and .head.sha == $head and .head.repo.full_name == $repo' <<<"$pr" >/dev/null

          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD_SHA&event=pull_request&per_page=100")"
          selected="$(jq -c --arg sha "$EXPECTED_HEAD_SHA" --argjson pr "$PR_NUMBER" \
            '[.workflow_runs[] | select(.path == ".github/workflows/android-ci.yml"
              and .head_sha == $sha and any(.pull_requests[]?; .number == $pr))]
             | sort_by(.run_number) | last // empty' <<<"$runs")"
          test -n "$selected"
          jq -e '.status == "completed" and .conclusion == "success"' <<<"$selected" >/dev/null
          run_id="$(jq -r '.id' <<<"$selected")"

          # Reuse the same predicate for positive and negative fixture tests.
          job_filter='
            (.jobs | length > 0)
            and all(.jobs[]; .status == "completed" and .conclusion == "success")
            and ([.jobs[].name] | index("JVM unit tests") != null)
            and ([.jobs[].name] | index("Generate Gradle Wrapper bootstrap files") != null)
            and ([.jobs[].name] | index("Android emulator instrumentation tests") != null)
            and ([.jobs[].name] | index("Build debug APK") != null)
            and ([.jobs[].name] | index("Install and launch exact APK (API 31)") != null)
            and ([.jobs[].name] | index("Install and launch exact APK (API 35)") != null)
            and ([.jobs[].name] | map(select(startswith("Install and launch exact APK (API "))) | length == 2)
          '

          valid_fixture="$(jq -n '[
            "JVM unit tests",
            "Generate Gradle Wrapper bootstrap files",
            "Android emulator instrumentation tests",
            "Build debug APK",
            "Install and launch exact APK (API 31)",
            "Install and launch exact APK (API 35)"
          ] | {jobs: map({name: ., status: "completed", conclusion: "success"})}')"
          jq -e "$job_filter" <<<"$valid_fixture" >/dev/null

          missing_wrapper="$(jq -n '[
            "JVM unit tests",
            "Android emulator instrumentation tests",
            "Build debug APK",
            "Install and launch exact APK (API 31)",
            "Install and launch exact APK (API 35)"
          ] | {jobs: map({name: ., status: "completed", conclusion: "success"})}')"
          if jq -e "$job_filter" <<<"$missing_wrapper" >/dev/null 2>&1; then
            echo "::error::Negative test failed: missing Gradle Wrapper bootstrap job was accepted."
            exit 1
          fi

          missing_api35="$(jq -n '[
            "JVM unit tests",
            "Android emulator instrumentation tests",
            "Build debug APK",
            "Install and launch exact APK (API 31)"
          ] | {jobs: map({name: ., status: "completed", conclusion: "success"})}')"
          if jq -e "$job_filter" <<<"$missing_api35" >/dev/null 2>&1; then
            echo "::error::Negative test failed: missing API 35 job was accepted."
            exit 1
          fi

          failed_api35="$(jq -n '[
            {name:"JVM unit tests",status:"completed",conclusion:"success"},
            {name:"Generate Gradle Wrapper bootstrap files",status:"completed",conclusion:"success"},
            {name:"Android emulator instrumentation tests",status:"completed",conclusion:"success"},
            {name:"Build debug APK",status:"completed",conclusion:"success"},
            {name:"Install and launch exact APK (API 31)",status:"completed",conclusion:"success"},
            {name:"Install and launch exact APK (API 35)",status:"completed",conclusion:"failure"}
          ] | {jobs:.}')"
          if jq -e "$job_filter" <<<"$failed_api35" >/dev/null 2>&1; then
            echo "::error::Negative test failed: failed API 35 job was accepted."
            exit 1
          fi

          extra_api_job="$(jq -n '[
            "JVM unit tests",
            "Generate Gradle Wrapper bootstrap files",
            "Android emulator instrumentation tests",
            "Build debug APK",
            "Install and launch exact APK (API 31)",
            "Install and launch exact APK (API 35)",
            "Install and launch exact APK (API 36)"
          ] | {jobs: map({name: ., status: "completed", conclusion: "success"})}')"
          if jq -e "$job_filter" <<<"$extra_api_job" >/dev/null 2>&1; then
            echo "::error::Negative test failed: unexpected API matrix job was accepted."
            exit 1
          fi
          echo "Merge-gate job predicate tests passed (1 positive, 3 negative)."

          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
          jq -e "$job_filter" <<<"$jobs" >/dev/null

          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          jq -e '
            [.artifacts[] | select(.expired == false and .size_in_bytes > 0) | .name] as $names
            | ["android-instrumentation-diagnostics","rz-ai-singing-studio-debug",
               "apk-validation-api-31","apk-validation-api-35"]
            | all(. as $required | $names | index($required) != null)
          ' <<<"$artifacts" >/dev/null

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Exact-head CI and evidence checks passed for PR #$PR_NUMBER."

  merge:
    name: Revalidate and merge exact authorized commit
    needs: verify-authorization-and-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Revalidate PR immediately before merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Merge job must run from main."; exit 1; }
          test "$GITHUB_ACTOR" = "Khun19"
          test "$TRIGGERING_ACTOR" = "Khun19" || { echo "::error::Only Khun19 may run or rerun this authorization."; exit 1; }
          main_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          current_main_sha="$(jq -r '.object.sha' <<<"$main_ref")"
          test "$current_main_sha" = "$EXPECTED_BASE_SHA" || {
            echo "::error::main moved before merge; refusing stale authorization."
            exit 1
          }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$EXPECTED_HEAD_SHA" \
            '.state == "open" and .merged == false and .draft == false
             and .base.ref == "main"
             and .head.sha == $head and .head.repo.full_name == $repo' <<<"$pr" >/dev/null

      - name: Merge only the authorized head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_HEAD_SHA" -f merge_method=squash)"
          jq -e '.merged == true and (.sha | type == "string" and length == 40)' <<<"$result" >/dev/null
          jq '{merged, sha, message}' <<<"$result"
