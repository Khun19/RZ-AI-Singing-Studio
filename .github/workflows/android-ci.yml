name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-wrapper:
    name: Generate Gradle Wrapper bootstrap files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Commit Gradle Wrapper to feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper is already committed."
          else
            git commit -m "build: add Gradle 8.9 wrapper"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload wrapper files for repository commit
        uses: actions/upload-artifact@v4
        with:
          name: rz-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate committed Gradle Wrapper
        run: ./gradlew --version
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  instrumentation-tests:
    name: Android emulator instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "/dev/kvm is unavailable; emulator runner will use software fallback."
          fi
      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/run-emulator-tests.sh
      - name: Capture emulator diagnostics (always)
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="app/build/ci-diagnostics"
          mkdir -p "$diagnostics_dir"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$diagnostics_dir/captured-at.txt"
          id > "$diagnostics_dir/runner-identity.txt" 2>&1
          groups >> "$diagnostics_dir/runner-identity.txt" 2>&1
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm > "$diagnostics_dir/kvm-device.txt" 2>&1
            test -r /dev/kvm && echo readable >> "$diagnostics_dir/kvm-device.txt"
            test -w /dev/kvm && echo writable >> "$diagnostics_dir/kvm-device.txt"
          else
            echo "/dev/kvm unavailable" > "$diagnostics_dir/kvm-device.txt"
          fi
          if command -v adb >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=3s 12s adb devices -l > "$diagnostics_dir/adb-devices-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb get-state > "$diagnostics_dir/adb-state-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb shell getprop > "$diagnostics_dir/emulator-getprop-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb logcat -b all -d -t 5000 > "$diagnostics_dir/logcat-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb shell dumpsys activity processes > "$diagnostics_dir/activity-processes-final.txt" 2>&1 || true
          else
            echo "adb command unavailable" > "$diagnostics_dir/adb-unavailable.txt"
          fi
          ps auxww | grep -E '[e]mulator|[q]emu|[a]db' > "$diagnostics_dir/emulator-processes.txt" 2>&1
          df -h > "$diagnostics_dir/disk-space.txt" 2>&1
          free -h > "$diagnostics_dir/memory.txt" 2>&1
      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [unit-tests, instrumentation-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK with committed Wrapper
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rz-ai-singing-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  validate-built-apk:
    name: Install and launch exact APK (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    needs: [build-debug]
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
          else
            echo "/dev/kvm is unavailable; emulator runner will use software fallback."
          fi
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: actions/download-artifact@v4
        with:
          name: rz-ai-singing-studio-debug
          path: artifacts/apk
      - name: Install and validate exact built APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/validate-built-apk.sh artifacts/apk/app-debug.apk
      - name: Capture APK emulator diagnostics (always)
        if: always()
        shell: bash
        run: |
          set +e
          diagnostics_dir="app/build/apk-validation/diagnostics"
          mkdir -p "$diagnostics_dir"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$diagnostics_dir/captured-at.txt"
          id > "$diagnostics_dir/runner-identity.txt" 2>&1
          groups >> "$diagnostics_dir/runner-identity.txt" 2>&1
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm > "$diagnostics_dir/kvm-device.txt" 2>&1
            test -r /dev/kvm && echo readable >> "$diagnostics_dir/kvm-device.txt"
            test -w /dev/kvm && echo writable >> "$diagnostics_dir/kvm-device.txt"
          else
            echo "/dev/kvm unavailable" > "$diagnostics_dir/kvm-device.txt"
          fi
          if command -v adb >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=3s 12s adb devices -l > "$diagnostics_dir/adb-devices-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb get-state > "$diagnostics_dir/adb-state-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb shell getprop > "$diagnostics_dir/emulator-getprop-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb logcat -b all -d -t 5000 > "$diagnostics_dir/logcat-final.txt" 2>&1 || true
            timeout --signal=TERM --kill-after=3s 12s adb shell dumpsys activity processes > "$diagnostics_dir/activity-processes-final.txt" 2>&1 || true
          else
            echo "adb command unavailable" > "$diagnostics_dir/adb-unavailable.txt"
          fi
          ps auxww | grep -E '[e]mulator|[q]emu|[a]db' > "$diagnostics_dir/emulator-processes.txt" 2>&1
          df -h > "$diagnostics_dir/disk-space.txt" 2>&1
          free -h > "$diagnostics_dir/memory.txt" 2>&1
      - name: Upload APK validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-validation-api-${{ matrix.api-level }}
          path: app/build/apk-validation/
          if-no-files-found: warn
          retention-days: 14
