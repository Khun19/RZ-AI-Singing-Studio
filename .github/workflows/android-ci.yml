name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-wrapper:
    name: Generate Gradle Wrapper bootstrap files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Commit Gradle Wrapper to feature branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle Wrapper is already committed."
          else
            git commit -m "build: add Gradle 8.9 wrapper"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload wrapper files for repository commit
        uses: actions/upload-artifact@v4
        with:
          name: rz-gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate committed Gradle Wrapper
        run: ./gradlew --version
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

  instrumentation-tests:
    name: Android emulator instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            timeout 180s adb wait-for-device
            for attempt in $(seq 1 60); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            timeout 15m ./gradlew connectedDebugAndroidTest --stacktrace --console=plain
      - name: Capture emulator diagnostics on failure
        if: failure()
        run: |
          adb devices -l || true
          adb shell getprop || true
          adb logcat -d -t 3000 || true

  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: [unit-tests, instrumentation-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK with committed Wrapper
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rz-ai-singing-studio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
